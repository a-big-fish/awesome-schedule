    <div class="calendar-workspace-toolbar">
      <div class="personal-toolbar-actions"><button type="button" class="btn secondary quick-calendar-toggle" data-quick-calendar-toggle aria-controls="personal-quick-calendar" aria-expanded="true" aria-label="收起快速跳转日历"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h2M11 14h2M15 14h2M7 18h2M11 18h2"/></svg></button><a class="btn secondary" href="/my-schedule/ideas">添加idea</a><a class="btn" href="/my-schedule/new">＋ 添加日程</a></div>
      <div class="calendar-date-navigation"><a class="date-nav" href="/my-schedule?view={{ selected_view }}&amp;date_value={{ prev_date }}{{ completed_query }}" aria-label="上一个{{ '月' if selected_view == 'month' else '周' if selected_view == 'week' else '日' }}">‹</a><strong>{{ (selected_date.strftime('%Y / %m / %d') if selected_view == 'day' else selected_date.strftime('%Y 年 %m 月')) if selected_date else '' }}</strong><a class="date-nav" href="/my-schedule?view={{ selected_view }}&amp;date_value={{ next_date }}{{ completed_query }}" aria-label="下一个{{ '月' if selected_view == 'month' else '周' if selected_view == 'week' else '日' }}">›</a></div>
      <div class="calendar-toolbar-end"><a class="btn secondary personal-today-link" href="/my-schedule?view={{ selected_view }}&amp;date_value={{ (today_date.isoformat() if today_date else '') }}">今天</a><nav class="personal-view-switch" aria-label="日程视图">
  {% set completed_query = '&show_completed=false' if not show_completed else '' %}
  <a href="/my-schedule?view=day&amp;date_value={{ (selected_date.isoformat() if selected_date else '') }}{{ completed_query }}" {% if selected_view == 'day' %}aria-current="page"{% endif %} aria-label="日视图">日</a>
  <a href="/my-schedule?view=week&amp;date_value={{ (selected_date.isoformat() if selected_date else '') }}{{ completed_query }}" {% if selected_view == 'week' %}aria-current="page"{% endif %} aria-label="周视图">周</a>
  <a href="/my-schedule?view=month&amp;date_value={{ (selected_date.isoformat() if selected_date else '') }}{{ completed_query }}" {% if selected_view == 'month' %}aria-current="page"{% endif %} aria-label="月视图">月</a>
</nav></div>
    </div>
    <div class="calendar-workspace-subtoolbar"><span>北京时间 · 跨天安排连续展示</span><button class="personal-calendar-toggle" type="button" data-calendar-toggle aria-pressed="true">切换全部日程</button></div>
