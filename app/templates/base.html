<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="workday-start" content="{{ request.state.user.workday_start if request.state.user is defined else '08:00' }}">
  <meta name="workday-end" content="{{ request.state.user.workday_end if request.state.user is defined else '18:00' }}">
  <title>{% block title %}会议日程规划器{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ asset_url('img/logo2.png') }}">
  <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
  {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="page">
    <header class="page-header">
      {% block brand %}<a class="brand" href="/meetings/schedule" aria-label="会议日程">
        <img class="brand-logo" src="{{ asset_url('img/logo2.png') }}" alt="" width="38" height="38">
        <span>会议日程</span>
      </a>{% endblock %}
      {% block navigation %}<nav class="page-nav">
        <a class="nav-link" href="/">门户</a>
        <a class="nav-link {% block nav_index %}{% endblock %}" href="/meetings/new">添加会议</a>
        <a class="nav-link {% block nav_schedule %}{% endblock %}" href="/meetings/schedule">时间表</a>
        <a class="nav-link" href="/meetings/settings">工作与休息时间</a>
      </nav>{% endblock %}
    </header>
    <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
    {% block footer %}{% endblock %}
  </div>
  <dialog class="personal-time-dialog" data-time-dialog aria-label="选择日期和时间">
  <div class="personal-time-dialog-heading">
    <strong data-time-heading></strong>
    <button type="button" class="personal-time-close" data-time-close aria-label="关闭">×</button>
  </div>
  <div class="personal-time-progress" aria-live="polite" data-time-progress></div>
  <div class="personal-time-options" data-time-options></div>
  <div class="personal-time-actions">
    <button type="button" class="btn secondary personal-time-now" data-time-now>当前时间</button>
    <button type="button" class="btn secondary" data-time-back>上一步</button>
    <button type="button" class="btn secondary" data-time-cancel>取消</button>
  </div>
</dialog>
  <script src="{{ asset_url('js/personal_time_picker.js') }}" defer></script>
  {% block scripts %}{% endblock %}
  <script src="{{ asset_url('js/app.js') }}"></script>
</body>
</html>
