<details class="idea-bubble" data-idea-bubble hidden>
  <summary aria-label="添加 idea，点击展开">
    <span class="idea-bubble-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h16v23l-8-6-8 6V5Z"/><path d="M12 11h8M14 14h4"/></svg></span>
    <span class="idea-bubble-label" data-idea-label>添加idea</span>
    <span class="idea-bubble-badge" data-idea-count aria-hidden="true" hidden>0</span>
    <span class="idea-bubble-preview" data-idea-preview>先记下一个想法</span>
    <span class="idea-bubble-arrow" aria-hidden="true">›</span>
  </summary>
  <section class="idea-bubble-panel" aria-label="待安排事项预览">
    <div class="idea-bubble-heading"><strong data-idea-heading>还没有待安排的想法</strong><button type="button" data-idea-close aria-label="收起待安排事项">×</button></div>
    <p data-idea-hint hidden>先记下来，有空时再安排。</p>
    <ul data-idea-items></ul>
    <a class="btn secondary" data-idea-cta href="/my-schedule/ideas">记录 idea</a>
  </section>
</details>
